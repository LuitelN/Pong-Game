<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>RALLY 100</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="game" aria-label="RALLY 100 cooperative Pong game"></canvas>
    <header id="hud">
      <div class="brand">
        <div class="title">RALLY 100</div>
        <div class="sub">CO-OP CHALLENGE</div>
      </div>
      <div class="score-wrap">
        <div class="score-label">VOLLEY</div>
        <div id="score">0000</div>
      </div>
      <div class="stats">
        BEST <b id="best">0000</b><br />WINS <b id="wins">00</b>
      </div>
      <button
        id="pauseButton"
        class="pause-button"
        type="button"
        aria-label="Pause game"
        aria-pressed="false"
      >
        Ⅱ PAUSE
      </button>
    </header>
    <div
      id="checkpointToast"
      class="checkpoint-toast"
      role="status"
      aria-live="polite"
    ></div>
    <div id="startHint" class="start-hint">MOVE WITH ↑ ↓ / W S / TOUCH</div>
    <div id="overlay" class="overlay" role="dialog" aria-modal="true">
      <div class="panel">
        <h1 id="endTitle">VICTORY</h1>
        <p id="endText">1000 VOLLEY RALLY COMPLETE</p>
        <button id="resume" class="retro-button resume-button" type="button">
          RESUME
        </button>
        <button id="again" class="retro-button">PLAY AGAIN</button>
        <button id="share" class="retro-button secondary" type="button">
          SHARE
        </button>
      </div>
    </div>
    <div
      id="onboarding"
      class="onboarding"
      role="dialog"
      aria-modal="true"
      aria-labelledby="onboardingTitle"
      aria-describedby="onboardingText"
    >
      <div class="onboarding-panel">
        <div class="onboarding-kicker" id="onboardingKicker">HOW TO PLAY</div>
        <h1 id="onboardingTitle">MOVE YOUR PADDLE</h1>
        <p id="onboardingText">
          Use the mouse or arrow keys to move the pink paddle and return the
          ball.
        </p>
        <div id="arrowDemo" class="arrow-demo" aria-hidden="true">
          <div class="demo-paddle"></div>
          <div class="demo-ball"></div>
          <div class="demo-arrows">
            <span>↑</span>
            <span>↓</span>
          </div>
        </div>
        <button
          id="onboardingNext"
          class="retro-button onboarding-button"
          type="button"
        >
          TAP / ENTER
        </button>
      </div>
    </div>

    <!-- Legacy inline script retained only for migration; game logic is loaded from game.js. -->
    <!--
    <script>
      (() => {
        "use strict";

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");
        const winsEl = document.getElementById("wins");
        const overlay = document.getElementById("overlay");
        const endTitle = document.getElementById("endTitle");
        const endText = document.getElementById("endText");
        const againBtn = document.getElementById("again");
        const shareBtn = document.getElementById("share");
        const hint = document.getElementById("startHint");

        ctx.imageSmoothingEnabled = false;

        let W = 0,
          H = 0,
          dpr = 1;
        let state = loadSave();
        let mode = "play";
        let lastTime = 0;
        let shake = 0;
        let flash = 0;
        let keys = {};
        let pointerActive = false;
        let particles = [];
        let confetti = [];

        const ball = {
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          r: 8,
          baseSpeed: 480,
          speed: 480,
        };
        const left = { x: 38, y: 0, w: 14, h: 110, vy: 0, target: 0 };
        const right = { x: 0, y: 0, w: 14, h: 110, vy: 0 };

        function loadSave() {
          try {
            const saved = JSON.parse(localStorage.getItem("rally100_save"));
            return {
              currentScore: 0,
              bestScore: Math.max(0, saved?.bestScore || 0),
              wins: Math.max(0, saved?.wins || 0),
            };
          } catch (_) {
            return { currentScore: 0, bestScore: 0, wins: 0 };
          }
        }

        function save() {
          try {
            localStorage.setItem(
              "rally100_save",
              JSON.stringify({
                currentScore: state.currentScore,
                bestScore: state.bestScore,
                wins: state.wins,
              }),
            );
          } catch (_) {}
        }

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth;
          H = window.innerHeight;
          canvas.width = Math.round(W * dpr);
          canvas.height = Math.round(H * dpr);
          canvas.style.width = W + "px";
          canvas.style.height = H + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.imageSmoothingEnabled = false;
          left.x = Math.max(20, W * 0.035);
          right.x = W - Math.max(20, W * 0.035) - right.w;
          left.h = right.h = Math.max(68, Math.min(110, H * 0.14));
          if (!ball.vx) resetBall(-1);
        }

        function resetBall(direction = -1) {
          ball.x = W * 0.5;
          ball.y = H * 0.5;
          ball.r = Math.max(6, Math.min(9, W * 0.009));
          ball.baseSpeed = Math.max(390, Math.min(520, W * 0.55));
          ball.speed = ball.baseSpeed;
          const angle = Math.random() * 0.7 - 0.35;
          ball.vx = Math.cos(angle) * ball.speed * direction;
          ball.vy = Math.sin(angle) * ball.speed;
          left.y = H * 0.5 - left.h * 0.5;
          right.y = H * 0.5 - right.h * 0.5;
        }

        function resetRally() {
          state.currentScore = 0;
          mode = "play";
          overlay.classList.remove("show");
          particles.length = 0;
          confetti.length = 0;
          right.h = Math.max(68, Math.min(110, H * 0.14));
          left.h = right.h;
          resetBall(Math.random() < 0.5 ? -1 : 1);
          updateHUD();
          save();
        }

        function updateHUD() {
          scoreEl.textContent = String(state.currentScore).padStart(3, "0");
          bestEl.textContent = String(state.bestScore).padStart(3, "0");
          winsEl.textContent = String(state.wins).padStart(2, "0");
        }

        function paddleDeflection(paddle, direction) {
          const paddleCenter = paddle.y + paddle.h * 0.5;
          const relative = Math.max(
            -1,
            Math.min(1, (ball.y - paddleCenter) / (paddle.h * 0.5)),
          );
          const angle = relative * (Math.PI / 4);
          ball.speed = Math.min(ball.speed * 1.015, ball.baseSpeed * 1.8);
          ball.vx = Math.cos(angle) * ball.speed * direction;
          ball.vy = Math.sin(angle) * ball.speed;
        }

        function paddleHit(paddle, direction) {
          paddleDeflection(paddle, direction);
          if (direction > 0) ball.x = paddle.x - ball.r;
          else ball.x = paddle.x + paddle.w + ball.r;
          shake = Math.min(8, shake + 3.5);
          flash = 1;
          burst(ball.x, ball.y, direction > 0 ? "#64f4ff" : "#ff5baf", 10);
          hitSound(direction > 0 ? 220 : 330);
        }

        function circleRectCollision(paddle) {
          return (
            ball.x + ball.r >= paddle.x &&
            ball.x - ball.r <= paddle.x + paddle.w &&
            ball.y + ball.r >= paddle.y &&
            ball.y - ball.r <= paddle.y + paddle.h
          );
        }

        function burst(x, y, color, count) {
          for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2,
              s = 80 + Math.random() * 220;
            particles.push({
              x,
              y,
              vx: Math.cos(a) * s,
              vy: Math.sin(a) * s,
              life: 1,
              max: 1,
              size: 2 + Math.random() * 3,
              color,
            });
          }
        }

        function update(dt) {
          if (mode !== "play") {
            updateEffects(dt);
            return;
          }

          const scale = Math.min(dt, 1 / 30);
          hint.style.opacity = state.currentScore > 0 ? "0" : "1";

          // Keyboard and touch both control the right paddle smoothly.
          let desiredDy = 0;
          if (keys.ArrowUp || keys.KeyW) desiredDy -= 1;
          if (keys.ArrowDown || keys.KeyS) desiredDy += 1;
          right.vy +=
            (desiredDy * Math.min(H * 0.85, 720) - right.vy) *
            Math.min(1, scale * 15);
          right.y += right.vy * scale;
          right.y = Math.max(
            H * 0.12,
            Math.min(H - right.h - H * 0.04, right.y),
          );

          // AI tracks the ball with capped speed and slight prediction.
          left.target = ball.y - left.h * 0.5;
          const topLimit = H * 0.12,
            bottomLimit = H - right.h - H * 0.04;
          left.target = Math.max(topLimit, Math.min(bottomLimit, left.target));
          const aiSpeed = Math.min(H * 0.72, 410 + state.currentScore * 2.2);
          const diff = left.target - left.y;
          const aiMove = Math.max(-aiSpeed, Math.min(aiSpeed, diff * 8));
          left.y += aiMove * scale;
          left.y = Math.max(topLimit, Math.min(bottomLimit, left.y));

          ball.x += ball.vx * scale;
          ball.y += ball.vy * scale;

          if (ball.y - ball.r <= H * 0.09) {
            ball.y = H * 0.09 + ball.r;
            ball.vy = Math.abs(ball.vy);
          }
          if (ball.y + ball.r >= H - H * 0.035) {
            ball.y = H - H * 0.035 - ball.r;
            ball.vy = -Math.abs(ball.vy);
          }

          if (ball.vx < 0 && circleRectCollision(left)) paddleHit(left, 1);
          if (ball.vx > 0 && circleRectCollision(right)) {
            paddleHit(right, -1);
            state.currentScore++;
            if (state.currentScore > state.bestScore)
              state.bestScore = state.currentScore;
            const targetH = Math.max(
              62,
              Math.min(110, H * 0.14) * (1 - state.currentScore * 0.0019),
            );
            right.h = targetH;
            right.y = Math.max(
              H * 0.12,
              Math.min(H - right.h - H * 0.04, right.y),
            );
            updateHUD();
            save();
            if (state.currentScore >= 1000) win();
          }

          if (ball.x > W + ball.r * 3) gameOver();
          if (ball.x < -ball.r * 3) resetBall(-1);

          shake *= Math.pow(0.04, scale);
          flash *= Math.pow(0.01, scale);
          updateEffects(dt);
        }

        function updateEffects(dt) {
          const scale = Math.min(dt, 1 / 30);
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * scale;
            p.y += p.vy * scale;
            p.vx *= Math.pow(0.08, scale);
            p.vy *= Math.pow(0.08, scale);
            p.life -= scale * 1.8;
            if (p.life <= 0) particles.splice(i, 1);
          }
          for (let i = confetti.length - 1; i >= 0; i--) {
            const p = confetti[i];
            p.x += p.vx * scale;
            p.y += p.vy * scale;
            p.vy += 600 * scale;
            p.life -= scale * 0.45;
            if (p.life <= 0) confetti.splice(i, 1);
          }
        }

        function gameOver() {
          mode = "gameover";
          state.currentScore = 0;
          save();
          updateHUD();
          endTitle.textContent = "RALLY LOST";
          endTitle.className = "loss";
          endText.textContent =
            "BEST " +
            String(state.bestScore).padStart(3, "0") +
            "  •  WINS " +
            state.wins;
          overlay.classList.add("show");
        }

        let audioCtx;
        function hitSound(freq) {
          try {
            audioCtx ||= new (
              window.AudioContext || window.webkitAudioContext
            )();
            const o = audioCtx.createOscillator(),
              g = audioCtx.createGain();
            o.type = "square";
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.035, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(
              0.001,
              audioCtx.currentTime + 0.07,
            );
            o.connect(g);
            g.connect(audioCtx.destination);
            o.start();
            o.stop(audioCtx.currentTime + 0.07);
          } catch (_) {}
        }

        function victoryChime() {
          try {
            audioCtx ||= new (
              window.AudioContext || window.webkitAudioContext
            )();
            [261.63, 329.63, 392, 523.25].forEach((f, i) => {
              const o = audioCtx.createOscillator(),
                g = audioCtx.createGain(),
                t = audioCtx.currentTime + i * 0.11;
              o.type = "square";
              o.frequency.value = f;
              g.gain.setValueAtTime(0.0001, t);
              g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
              g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
              o.connect(g);
              g.connect(audioCtx.destination);
              o.start(t);
              o.stop(t + 0.44);
            });
          } catch (_) {}
        }

        function win() {
          mode = "victory";
          state.wins++;
          state.bestScore = Math.max(state.bestScore, 100);
          save();
          updateHUD();
          victoryChime();
          for (let i = 0; i < 180; i++)
            confetti.push({
              x: W * 0.5 + (Math.random() - 0.5) * W * 0.4,
              y: H * 0.42 + (Math.random() - 0.5) * H * 0.2,
              vx: (Math.random() - 0.5) * 600,
              vy: -300 - Math.random() * 500,
              life: 0.8 + Math.random() * 1.5,
              size: 3 + Math.random() * 7,
              color: ["#64f4ff", "#ff5baf", "#f7f7f5", "#ffe66d"][i % 4],
              rot: Math.random() * 6,
            });
          endTitle.textContent = "VICTORY";
          endTitle.className = "";
          endText.textContent =
            "100 VOLLEY RALLY COMPLETE  •  WINS " + state.wins;
          setTimeout(() => overlay.classList.add("show"), 420);
        }

        function draw() {
          ctx.save();
          if (shake > 0)
            ctx.translate(
              (Math.random() - 0.5) * shake,
              (Math.random() - 0.5) * shake,
            );
          ctx.fillStyle = "#0a0a0a";
          ctx.fillRect(-10, -10, W + 20, H + 20);

          ctx.fillStyle = "rgba(247,247,245,.075)";
          ctx.setLineDash([12, 14]);
          ctx.beginPath();
          ctx.moveTo(W * 0.5, H * 0.09);
          ctx.lineTo(W * 0.5, H - H * 0.035);
          ctx.strokeStyle = "rgba(247,247,245,.28)";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.fillStyle = "#64f4ff";
          ctx.fillRect(
            Math.round(left.x),
            Math.round(left.y),
            left.w,
            Math.round(left.h),
          );
          ctx.fillStyle = "#ff5baf";
          ctx.fillRect(
            Math.round(right.x),
            Math.round(right.y),
            right.w,
            Math.round(right.h),
          );

          ctx.fillStyle = "#f7f7f5";
          ctx.fillRect(
            Math.round(ball.x - ball.r),
            Math.round(ball.y - ball.r),
            Math.round(ball.r * 2),
            Math.round(ball.r * 2),
          );

          if (flash > 0.01) {
            ctx.fillStyle = `rgba(247,247,245,${flash * 0.08})`;
            ctx.fillRect(0, 0, W, H);
          }

          for (const p of particles) {
            ctx.globalAlpha = Math.max(0, p.life / p.max);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
          ctx.globalAlpha = 1;
          for (const p of confetti) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size * 0.5, -p.size * 0.5, p.size, p.size);
            ctx.restore();
            p.rot += 0.05;
          }
          ctx.restore();
        }

        function loop(time) {
          if (!lastTime) lastTime = time;
          const dt = (time - lastTime) / 1000 || 0;
          lastTime = time;
          update(dt);
          draw();
          requestAnimationFrame(loop);
        }

        window.addEventListener("resize", resize);
        window.addEventListener("keydown", (e) => {
          if (["ArrowUp", "ArrowDown", "KeyW", "KeyS"].includes(e.code)) {
            e.preventEvent?.();
            e.preventDefault();
            keys[e.code] = true;
          }
        });
        window.addEventListener("keyup", (e) => {
          keys[e.code] = false;
        });

        canvas.addEventListener("pointerdown", (e) => {
          pointerActive = true;
          canvas.setPointerCapture?.(e.pointerId);
          movePointer(e);
        });
        canvas.addEventListener("pointermove", (e) => {
          if (pointerActive) movePointer(e);
        });
        canvas.addEventListener("pointerup", () => {
          pointerActive = false;
        });
        canvas.addEventListener("pointercancel", () => {
          pointerActive = false;
        });
        function movePointer(e) {
          right.y += (e.clientY - right.h * 0.5 - right.y) * 0.32;
        }

        againBtn.addEventListener("click", resetRally);
        shareBtn.addEventListener("click", async () => {
          const text = `I reached ${state.bestScore}-volleys in RALLY 100! 🏓\nBest: ${state.bestScore} • Wins: ${state.wins}`;
          try {
            if (navigator.share)
              await navigator.share({ title: "RALLY 100", text });
            else {
              await navigator.clipboard.writeText(text);
              shareBtn.textContent = "COPIED";
              setTimeout(() => (shareBtn.textContent = "SHARE"), 1200);
            }
          } catch (_) {}
        });

        resize();
        right.y = H * 0.5 - right.h * 0.5;
        left.y = H * 0.5 - left.h * 0.5;
        resetBall(-1);
        updateHUD();
        requestAnimationFrame(loop);
      })();
    </script>
